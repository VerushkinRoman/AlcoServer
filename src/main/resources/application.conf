ktor {
    deployment {
        port = 3345
        port = ${?PORT}
        host = "127.0.0.1"
        host = ${?HOST}
    }

    application {
        modules = [ ru.alcoserver.ApplicationKt.configureServer ]
    }
}

google {
    cloud {
        project-number = 929390260810
        project-number = ${?GOOGLE_CLOUD_PROJECT_NUMBER}
    }
}

# Firebase App Check enforcement mode for /api/v1 business endpoints.
# off     - skip verification entirely
# monitor - verify and log the verdict, but allow the request
# enforce - reject requests without a valid token with 401 Unauthenticated
app-check {
    mode = "monitor"
    mode = ${?APP_CHECK_MODE}
}

# Apple App Attest (iOS integrity). Secrets/private values go into the
# gitignored application.local.conf; only non-secret identifiers are read here.
apple {
    team-id = ${?APPLE_TEAM_ID}
    bundle-id = ${?APPLE_BUNDLE_ID}
    devicecheck-key-path = ${?APPLE_DEVICECHECK_KEY_PATH}
}

firebase {
    config {
        path = "config/firebase-service-account.json"
        path = ${?FIREBASE_CONFIG_PATH}
    }
}

include "application.local.conf"

yookassa {
    shop-id = ${?YOOKASSA_SHOP_ID}
    secret-key = ${?YOOKASSA_SECRET_KEY}
    client-public-key = ${?YOOKASSA_CLIENT_PUBLIC_KEY}
}
